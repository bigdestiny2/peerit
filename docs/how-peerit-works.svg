<svg viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">How a Peerit operation moves through the browser P2P stack</title>
  <desc id="desc">An explicit user action is signed by a durable identity and committed to a local journal. When current signed network authorities qualify, the browser encrypts immutable body cells, verifies relay receipts and reads the bytes back, then appends a small discovery pointer. Another client authenticates the release and discovery chain, fetches the cells by capability, verifies the author operation, and materializes its own feed.</desc>
  <style>
    :root{--bg:#ffffff;--panel:#f6f8fa;--line:#d0d7de;--ink:#1f2328;--muted:#59636e;--blue:#0969da;--bluefill:#ddf4ff;--teal:#117f63;--tealfill:#d2f3e9;--gold:#9a6700;--goldfill:#fff8c5;--violet:#8250df;--violetfill:#fbefff}
    @media (prefers-color-scheme: dark){:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--ink:#e6edf3;--muted:#9198a1;--blue:#4493f8;--bluefill:#0b2a4a;--teal:#3fb950;--tealfill:#0c2a1c;--gold:#d29922;--goldfill:#2b2408;--violet:#a371f7;--violetfill:#24153d}}
    .heading{font-weight:700;font-size:18px;fill:var(--ink)}
    .label{font-weight:600;font-size:14px;fill:var(--ink)}
    .copy{font-size:12px;fill:var(--ink)}
    .muted{font-size:11px;fill:var(--muted)}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="359" rx="14" fill="var(--bg)" stroke="var(--line)"/>
  <text class="heading" x="480" y="32" text-anchor="middle">Local first; network only with qualified authority</text>

  <rect x="24" y="78" width="142" height="76" rx="10" fill="var(--panel)" stroke="var(--line)"/>
  <text class="label" x="95" y="106" text-anchor="middle">explicit action</text>
  <text class="copy" x="95" y="128" text-anchor="middle">post · vote · comment</text>
  <text class="muted" x="95" y="145" text-anchor="middle">no key minted on read</text>

  <line x1="168" y1="116" x2="204" y2="116" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="208" y="66" width="168" height="100" rx="10" fill="var(--bluefill)" stroke="var(--blue)"/>
  <text class="label" x="292" y="94" text-anchor="middle">identity + journal</text>
  <text class="copy" x="292" y="117" text-anchor="middle">canonical operation signed</text>
  <text class="copy" x="292" y="136" text-anchor="middle">persisted before network I/O</text>
  <text class="muted" x="292" y="154" text-anchor="middle">host key or device key</text>

  <line x1="378" y1="116" x2="418" y2="92" stroke="var(--gold)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="378" y1="116" x2="418" y2="216" stroke="var(--violet)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="422" y="52" width="184" height="92" rx="10" fill="var(--goldfill)" stroke="var(--gold)"/>
  <text class="label" x="514" y="80" text-anchor="middle">encrypted CELL replicas</text>
  <text class="copy" x="514" y="103" text-anchor="middle">opaque immutable body bytes</text>
  <text class="copy" x="514" y="122" text-anchor="middle">receipt → capability GET → equality</text>

  <rect x="422" y="184" width="184" height="82" rx="10" fill="var(--violetfill)" stroke="var(--violet)"/>
  <text class="label" x="514" y="212" text-anchor="middle">INBOX pointer</text>
  <text class="copy" x="514" y="235" text-anchor="middle">small append-only discovery frame</text>
  <text class="muted" x="514" y="253" text-anchor="middle">published after body verification</text>

  <line x1="608" y1="98" x2="656" y2="134" stroke="var(--gold)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="608" y1="225" x2="656" y2="180" stroke="var(--violet)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="660" y="70" width="178" height="142" rx="10" fill="var(--tealfill)" stroke="var(--teal)"/>
  <text class="label" x="749" y="98" text-anchor="middle">another client verifies</text>
  <text class="copy" x="749" y="122" text-anchor="middle">release + bootstrap floors</text>
  <text class="copy" x="749" y="142" text-anchor="middle">relay + pointer signatures</text>
  <text class="copy" x="749" y="162" text-anchor="middle">cell hash + decryption</text>
  <text class="copy" x="749" y="182" text-anchor="middle">author + operation authority</text>
  <text class="muted" x="749" y="201" text-anchor="middle">failure at any layer is rejected</text>

  <line x1="840" y1="141" x2="874" y2="141" stroke="var(--teal)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="878" y="92" width="58" height="98" rx="10" fill="var(--panel)" stroke="var(--line)"/>
  <text class="label" x="907" y="125" text-anchor="middle">local</text>
  <text class="label" x="907" y="145" text-anchor="middle">feed</text>
  <text class="muted" x="907" y="168" text-anchor="middle">own policy</text>

  <rect x="208" y="286" width="630" height="54" rx="8" fill="var(--panel)" stroke="var(--line)"/>
  <text class="copy" x="523" y="307" text-anchor="middle">Network arrows activate only with current signed bootstraps and qualified runtime modules.</text>
  <text class="copy" x="523" y="326" text-anchor="middle">Relays may withhold opaque bytes; they do not become the author, verifier, moderator or feed algorithm.</text>
</svg>
