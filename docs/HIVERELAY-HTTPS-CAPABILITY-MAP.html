      &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; data-journey=&quot;consumer&quot; aria-pressed=&quot;true&quot;&gt;Open an app&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-journey=&quot;write&quot; aria-pressed=&quot;false&quot;&gt;Write data&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-journey=&quot;upgrade&quot; aria-pressed=&quot;false&quot;&gt;Upgrade to P2P&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-journey=&quot;preview&quot; aria-pressed=&quot;false&quot;&gt;Expose localhost&lt;/button&gt;
    &lt;/div&gt;

    &lt;article class=&quot;card journey-detail&quot; data-detail=&quot;consumer&quot;&gt;
      &lt;h3&gt;Ordinary consumer opens the application&lt;/h3&gt;
      &lt;div class=&quot;journey-flow&quot;&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;step-number&quot;&gt;1&lt;/span&gt;&lt;strong&gt;Open&lt;/strong&gt;&lt;span&gt;A normal publisher URL loads in any browser.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;step-number&quot;&gt;2&lt;/span&gt;&lt;strong&gt;Route&lt;/strong&gt;&lt;span&gt;DNS or a capable resolver selects an authorized gateway.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;step-number&quot;&gt;3&lt;/span&gt;&lt;strong&gt;Admit&lt;/strong&gt;&lt;span&gt;The edge requires explicit public T1 status and a pinned drive version.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;step-number&quot;&gt;4&lt;/span&gt;&lt;strong&gt;Serve&lt;/strong&gt;&lt;span&gt;Exact bytes arrive; capable clients can request and verify Merkle proofs.&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;trust-line&quot;&gt;Vanilla first-load trust is the publisher HTTPS origin. The canonical app key and proof mode let PearBrowser, SDKs, or trusted loaders verify provenance independently.&lt;/div&gt;
    &lt;/article&gt;

    &lt;article class=&quot;card journey-detail&quot; data-detail=&quot;write&quot; hidden&gt;
      &lt;h3&gt;Browser application writes decentralized state&lt;/h3&gt;
      &lt;div class=&quot;journey-flow&quot;&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;step-number&quot;&gt;1&lt;/span&gt;&lt;strong&gt;Compose locally&lt;/strong&gt;&lt;span&gt;The app owns schemas, identities, merge rules, and retry journals.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;step-number&quot;&gt;2&lt;/span&gt;&lt;strong&gt;Seal&lt;/strong&gt;&lt;span&gt;Records are signed and encrypted into bounded opaque cells.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;step-number&quot;&gt;3&lt;/span&gt;&lt;strong&gt;Replicate&lt;/strong&gt;&lt;span&gt;The browser sends qualified operations to several independent relays.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;step-number&quot;&gt;4&lt;/span&gt;&lt;strong&gt;Verify&lt;/strong&gt;&lt;span&gt;Signed responses and readback evidence determine the durability label.&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;trust-line&quot;&gt;Current Peerit uses OutboxLog HTTP/SSE as the compatibility route. The destination is the app-agnostic blind HTTPS ABI: DESCRIBE, CELL, INBOX, CORE, and FORWARD.&lt;/div&gt;
    &lt;/article&gt;

    &lt;article class=&quot;card journey-detail&quot; data-detail=&quot;upgrade&quot; hidden&gt;
      &lt;h3&gt;Capable browser leaves the HTTP-only path&lt;/h3&gt;
      &lt;div class=&quot;journey-flow&quot;&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;step-number&quot;&gt;1&lt;/span&gt;&lt;strong&gt;Discover&lt;/strong&gt;&lt;span&gt;Signed capability documents advertise optional WSS transports.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;step-number&quot;&gt;2&lt;/span&gt;&lt;strong&gt;Connect&lt;/strong&gt;&lt;span&gt;DHT-over-WS bridges browser control traffic through a selected relay.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;step-number&quot;&gt;3&lt;/span&gt;&lt;strong&gt;Match peers&lt;/strong&gt;&lt;span&gt;The browser looks up or announces and establishes Noise-protected streams.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;step-number&quot;&gt;4&lt;/span&gt;&lt;strong&gt;Go native&lt;/strong&gt;&lt;span&gt;PearBrowser can resolve the canonical link and use direct Hyperdrive/Hyperswarm.&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;trust-line&quot;&gt;WSS improves participation, not anonymity: the bridge operator sees connection metadata and timing. It should remain an automatic enhancement, never a consumer prerequisite.&lt;/div&gt;
    &lt;/article&gt;

    &lt;article class=&quot;card journey-detail&quot; data-detail=&quot;preview&quot; hidden&gt;
      &lt;h3&gt;Developer exposes a live local service&lt;/h3&gt;
      &lt;div class=&quot;journey-flow&quot;&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;step-number&quot;&gt;1&lt;/span&gt;&lt;strong&gt;Expose&lt;/strong&gt;&lt;span&gt;A local agent opens an outbound Holesail endpoint for one port.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;step-number&quot;&gt;2&lt;/span&gt;&lt;strong&gt;Lease&lt;/strong&gt;&lt;span&gt;The publisher signs hostname, tunnel, methods, limits, and expiry.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;step-number&quot;&gt;3&lt;/span&gt;&lt;strong&gt;Accept&lt;/strong&gt;&lt;span&gt;One or more independent edges validate and advertise the route.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;step-number&quot;&gt;4&lt;/span&gt;&lt;strong&gt;Forward&lt;/strong&gt;&lt;span&gt;A browser uses HTTPS while the edge dials the local service over Holesail.&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;trust-line&quot;&gt;This is decentralized reachability, not durable hosting. When the local service stops, the preview stops. Production should snapshot and replicate the app into T1 gateways.&lt;/div&gt;
    &lt;/article&gt;
  &lt;/section&gt;

  &lt;section class=&quot;section&quot; aria-labelledby=&quot;tunnel-heading&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;
      &lt;h2 id=&quot;tunnel-heading&quot;&gt;ngrok-style capability: expose, then publish&lt;/h2&gt;
      &lt;span class=&quot;section-kicker&quot;&gt;Keep the familiar developer motion; remove the mandatory central gateway account.&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;tunnel-flow&quot; role=&quot;img&quot; aria-label=&quot;Proposed HiveRelay HTTPS over Holesail tunnel lifecycle&quot;&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;step-number&quot;&gt;1&lt;/span&gt;&lt;strong&gt;&lt;code&gt;hive expose 3000&lt;/code&gt;&lt;/strong&gt;&lt;span&gt;Agent creates outbound reachability and a signed, expiring route lease.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;step-number&quot;&gt;2&lt;/span&gt;&lt;strong&gt;Independent edges&lt;/strong&gt;&lt;span&gt;Several operators may accept the same publisher-authorized route.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;step-number&quot;&gt;3&lt;/span&gt;&lt;strong&gt;Normal HTTPS URL&lt;/strong&gt;&lt;span&gt;Temporary operator URL or publisher-owned domain works in any browser.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;step-number&quot;&gt;4&lt;/span&gt;&lt;strong&gt;Holesail to localhost&lt;/strong&gt;&lt;span&gt;The browser request crosses the edge and reaches the live local service.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;mode-grid&quot;&gt;
      &lt;div class=&quot;mode&quot;&gt;
        &lt;strong&gt;Edge-terminated HTTPS&lt;/strong&gt;
        &lt;span&gt;Best developer UX. The edge can apply authentication, rate limits, redirects, webhook checks, and security headers, but it sees plaintext HTTP.&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;mode&quot;&gt;
        &lt;strong&gt;TLS passthrough&lt;/strong&gt;
        &lt;span&gt;The publisher keeps the certificate key and the edge sees only SNI plus transport metadata. Privacy is stronger; programmable HTTP policy is narrower.&lt;/span&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;publish-flow&quot; aria-label=&quot;Recommended developer lifecycle from preview to durable publication&quot;&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;step-number&quot;&gt;1&lt;/span&gt;&lt;strong&gt;Expose&lt;/strong&gt;&lt;span&gt;Temporary live preview; stops with localhost.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;step-number&quot;&gt;2&lt;/span&gt;&lt;strong&gt;Publish&lt;/strong&gt;&lt;span&gt;Snapshot &lt;code&gt;./dist&lt;/code&gt; into a canonical Hyperdrive release.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;step-number&quot;&gt;3&lt;/span&gt;&lt;strong&gt;Bind&lt;/strong&gt;&lt;span&gt;Attach the publisher domain to several exact-byte T1 gateways.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

      &lt;span class=&quot;viz-badge&quot;&gt;Familiar outside · decentralized inside&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;recommendation-grid&quot;&gt;
      &lt;div class=&quot;recommended-stack&quot;&gt;
        &lt;div class=&quot;stack-layer&quot;&gt;&lt;strong&gt;Origin&lt;/strong&gt;&lt;span&gt;Publisher-owned HTTPS domain and installable PWA.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;stack-layer&quot;&gt;&lt;strong&gt;App bytes&lt;/strong&gt;&lt;span&gt;Two or more independent exact-byte public T1 gateways.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;stack-layer&quot;&gt;&lt;strong&gt;App state&lt;/strong&gt;&lt;span&gt;Local signing/encryption plus two or more independent blind relays.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;stack-layer&quot;&gt;&lt;strong&gt;Upgrade&lt;/strong&gt;&lt;span&gt;Automatic DHT/Hypercore WSS, then direct P2P in PearBrowser.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;stack-layer&quot;&gt;&lt;strong&gt;Preview&lt;/strong&gt;&lt;span&gt;HTTPS-over-Holesail for temporary local development and dynamic legacy services.&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;rank-list&quot; aria-label=&quot;Priority ranking&quot;&gt;
        &lt;div class=&quot;rank-item&quot;&gt;&lt;span class=&quot;rank-number&quot;&gt;1&lt;/span&gt;&lt;div&gt;&lt;strong&gt;Best consumer surface&lt;/strong&gt;&lt;span&gt;Publisher-owned HTTPS backed by multiple operators.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;rank-item&quot;&gt;&lt;span class=&quot;rank-number&quot;&gt;2&lt;/span&gt;&lt;div&gt;&lt;strong&gt;Most decentralized&lt;/strong&gt;&lt;span&gt;PearBrowser or native P2P using the canonical app key.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;rank-item&quot;&gt;&lt;span class=&quot;rank-number&quot;&gt;3&lt;/span&gt;&lt;div&gt;&lt;strong&gt;Best developer motion&lt;/strong&gt;&lt;span&gt;Expose locally, then publish and replicate.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;section&quot; aria-labelledby=&quot;guardrail-heading&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;
      &lt;h2 id=&quot;guardrail-heading&quot;&gt;Non-negotiable boundaries&lt;/h2&gt;
      &lt;span class=&quot;section-kicker&quot;&gt;These keep convenience from quietly becoming centralization or a privacy overclaim.&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;guardrails&quot;&gt;
      &lt;div class=&quot;guardrail&quot;&gt;&lt;strong&gt;Path mode is stateless compatibility&lt;/strong&gt;&lt;span&gt;Do not host credentialed or stateful applications on a shared gateway origin.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;guardrail&quot;&gt;&lt;strong&gt;Public gateway is not a blind store&lt;/strong&gt;&lt;span&gt;T1 serves declared-public app bytes only; custody and blind material stay structurally unreachable.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;guardrail&quot;&gt;&lt;strong&gt;Tunnel keys are not application auth&lt;/strong&gt;&lt;span&gt;Public Holesail keys are addresses. Private keys are sensitive capabilities. Protect the upstream either way.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;guardrail&quot;&gt;&lt;strong&gt;HTTPS and content verification differ&lt;/strong&gt;&lt;span&gt;Web PKI authenticates the hostname; proof-aware clients independently validate Hyperdrive provenance.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;guardrail&quot;&gt;&lt;strong&gt;No single gateway becomes the app identity&lt;/strong&gt;&lt;span&gt;Every response advertises the canonical app key and capable clients retain alternate operators.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;guardrail&quot;&gt;&lt;strong&gt;Consumer choice stays invisible by default&lt;/strong&gt;&lt;span&gt;Clients fail over automatically; advanced provenance and relay controls remain inspectable, not mandatory.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;hiverelay-capability-map&#x27;)
      if (!root) return
      const buttons = Array.from(root.querySelectorAll(&#x27;[data-journey]&#x27;))
      const details = Array.from(root.querySelectorAll(&#x27;[data-detail]&#x27;))

      const selectJourney = (name) =&gt; {
        buttons.forEach((button) =&gt; {
          const selected = button.dataset.journey === name
          button.setAttribute(&#x27;aria-pressed&#x27;, String(selected))
          button.classList.toggle(&#x27;btn-primary&#x27;, selected)
        })
        details.forEach((detail) =&gt; {
          detail.hidden = detail.dataset.detail !== name
        })
      }

      buttons.forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; selectJourney(button.dataset.journey))
      })
    })()
  &lt;/script&gt;
