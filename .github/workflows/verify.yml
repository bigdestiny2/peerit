name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-surface:
    name: Repository and documentation guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm run test:docs

  node-and-protocol:
    name: Node ${{ matrix.node-version }} — ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 22
            gate: full ship verification
            command: npm run test:ship
          - node-version: 24
            gate: core compatibility
            command: npm test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Check out accepted HiveRelay fixture
        if: matrix.node-version == 22
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: bigdestiny2/P2P-Hiverelay
          ref: adeacef07c5de4d17d5ed1389fee7a35095b862f
          path: .ci/hiverelay
          persist-credentials: false
      - name: Install HiveRelay fixture dependencies
        if: matrix.node-version == 22
        working-directory: .ci/hiverelay
        run: npm ci
      - run: ${{ matrix.command }}
        env:
          HIVERELAY_BLIND_ROOT: ${{ github.workspace }}/.ci/hiverelay

  browsers:
    name: Browser and accessibility verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser-runtime-sri
      - run: npm run test:browser:signed-release
      - run: npm run test:browser
      - run: npm run test:browser:mobile
      - run: npm run test:browser:android
      - run: npm run test:accessibility
      - run: npm run test:browser:firefox
      - run: npm run test:browser:webkit
