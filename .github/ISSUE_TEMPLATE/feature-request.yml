name: Feature request
description: Propose a user-facing or developer-facing improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user or developer problem before proposing an implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the smallest useful outcome and how someone would experience it.
    validations:
      required: true

  - type: checkboxes
    id: runtimes
    attributes:
      label: Affected runtimes
      options:
        - label: PearBrowser
        - label: Normal web browser
        - label: Local development fallback
        - label: Protocol or relay integration
        - label: Release or operator tooling

  - type: textarea
    id: trust
    attributes:
      label: Trust, privacy, and availability impact
      description: State whether this changes authority, identity custody, relay visibility, persistence, moderation, compatibility, or any public guarantee. Write "none" when it does not.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include smaller changes, existing patterns, or reasons the current behavior is insufficient.

  - type: textarea
    id: evidence
    attributes:
      label: Evidence or prototype
      description: Link to non-sensitive examples, tests, measurements, or prior art. Label experiments honestly.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and documentation for this request.
          required: true
        - label: I have not included secrets, private capabilities, identity material, credentials, or private operator details.
          required: true
